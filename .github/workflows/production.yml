name: Production APK Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    name: Build Production APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          DISPLAY_VERSION="${TAG#v}"
          # Use a numeric build number derived from the version parts
          BUILD_NUMBER=$(echo "$DISPLAY_VERSION" | awk -F. '{printf "%d%03d%03d", $1, $2, $3}')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Production version: $TAG (display: $DISPLAY_VERSION, build: $BUILD_NUMBER)"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        id: decode_keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          echo "keystore_available=true" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        if: steps.decode_keystore.outputs.keystore_available == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/keystore.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            -Pandroid.injected.version.name="${{ steps.version.outputs.display_version }}" \
            -Pandroid.injected.version.code="${{ steps.version.outputs.build_number }}"

      - name: Build unsigned APK
        if: steps.decode_keystore.outputs.keystore_available != 'true'
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.version.name="${{ steps.version.outputs.display_version }}" \
            -Pandroid.injected.version.code="${{ steps.version.outputs.build_number }}"

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: production-apk-${{ steps.version.outputs.tag }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 90
